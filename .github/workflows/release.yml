name: Release

# Сборка релиза при пуше тега вида v1.3, v2.0 и т.д.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK and run tests
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --console=plain

      - name: Rename APK by version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "TheAlfred-v${VERSION}-debug.apk"
          echo "APK_VERSION=v${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TheAlfred-*-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
